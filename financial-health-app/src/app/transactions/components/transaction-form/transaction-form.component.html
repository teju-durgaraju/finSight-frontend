<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header">
      <h3 class="mb-0">{{ isEditMode ? 'Edit' : 'Add' }} Transaction</h3>
    </div>
    <div class="card-body">
      <form [formGroup]="transactionForm" (ngSubmit)="onSubmit()">
        <!-- Type: Radio Buttons -->
        <div class="mb-3">
          <label class="form-label d-block">Type:</label>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" id="typeExpense" value="expense" formControlName="type">
            <label class="form-check-label" for="typeExpense">Expense</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" id="typeIncome" value="income" formControlName="type">
            <label class="form-check-label" for="typeIncome">Income</label>
          </div>
          <div *ngIf="f['type'].touched && f['type'].errors?.['required']" class="invalid-feedback d-block">
            Type is required.
          </div>
        </div>

        <!-- Date -->
        <div class="mb-3">
          <label for="date" class="form-label">Date:</label>
          <input type="date" id="date" class="form-control" formControlName="date"
                 [ngClass]="{ 'is-invalid': f['date'].touched && f['date'].invalid }">
          <div *ngIf="f['date'].touched && f['date'].errors?.['required']" class="invalid-feedback">
            Date is required.
          </div>
        </div>

        <!-- Description: Textarea -->
        <div class="mb-3">
          <label for="description" class="form-label">Description:</label>
          <textarea id="description" class="form-control" formControlName="description" rows="3"
                    [ngClass]="{ 'is-invalid': f['description'].touched && f['description'].invalid }"></textarea>
          <div *ngIf="f['description'].touched && f['description'].errors?.['required']" class="invalid-feedback">
            Description is required.
          </div>
        </div>

        <!-- Amount -->
        <div class="mb-3">
          <label for="amount" class="form-label">Amount:</label>
          <input type="number" id="amount" class="form-control" formControlName="amount" placeholder="0.00"
                 [ngClass]="{ 'is-invalid': f['amount'].touched && f['amount'].invalid }">
          <div *ngIf="f['amount'].touched && f['amount'].invalid" class="invalid-feedback">
            <span *ngIf="f['amount'].errors?.['required']">Amount is required.</span>
            <span *ngIf="f['amount'].errors?.['pattern']">Amount must be a valid number (e.g., 12.34).</span>
            <span *ngIf="f['amount'].errors?.['min']">Amount must be greater than 0.01.</span>
          </div>
        </div>

        <!-- Category: Dropdown -->
        <div class="mb-3">
          <label for="category" class="form-label">Category:</label>
          <select id="category" class="form-select" formControlName="category"
                  [ngClass]="{ 'is-invalid': f['category'].touched && f['category'].invalid }">
            <option value="" disabled>Select a category</option>
            <option *ngFor="let cat of categories$ | async" [value]="cat">{{ cat }}</option>
          </select>
          <div *ngIf="f['category'].touched && f['category'].errors?.['required']" class="invalid-feedback">
            Category is required.
          </div>
        </div>

        <div class="d-flex justify-content-end mt-4">
          <button type="button" class="btn btn-outline-secondary me-2" routerLink="/transactions">
            <app-lucide-icon name="x" class="me-1" size="18"></app-lucide-icon>Cancel
          </button>
          <button type="submit" class="btn btn-primary d-flex align-items-center" [disabled]="!transactionForm.valid">
            <app-lucide-icon name="save" class="me-1" size="18"></app-lucide-icon>
            {{ isEditMode ? 'Update' : 'Save' }} Transaction
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
