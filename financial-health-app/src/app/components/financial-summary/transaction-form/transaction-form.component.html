<div class="container mt-4">
  <h3>{{ isEditMode ? 'Edit' : 'Add' }} Transaction</h3>
  <form [formGroup]="transactionForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="date" class="form-label">Date</label>
      <input type="date" id="date" class="form-control" formControlName="date">
      <div *ngIf="transactionForm.get('date')?.invalid && transactionForm.get('date')?.touched" class="text-danger form-text">
        Date is required.
      </div>
    </div>
    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <input type="text" id="description" class="form-control" formControlName="description">
       <div *ngIf="transactionForm.get('description')?.invalid && transactionForm.get('description')?.touched" class="text-danger form-text">
        Description is required.
      </div>
    </div>
    <div class="mb-3">
      <label for="amount" class="form-label">Amount</label>
      <input type="number" id="amount" class="form-control" formControlName="amount">
       <div *ngIf="transactionForm.get('amount')?.invalid && transactionForm.get('amount')?.touched" class="text-danger form-text">
        Amount is required and must be a valid number.
      </div>
    </div>
    <div class="mb-3">
      <label for="type" class="form-label">Type</label>
      <select id="type" class="form-select" formControlName="type">
        <option value="expense">Expense</option>
        <option value="income">Income</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="category" class="form-label">Category</label>
      <input type="text" id="category" class="form-control" formControlName="category">
      <div *ngIf="transactionForm.get('category')?.invalid && transactionForm.get('category')?.touched" class="text-danger form-text">
        Category is required.
      </div>
    </div>
    <button type="submit" class="btn btn-primary d-flex align-items-center" [disabled]="!transactionForm.valid">
      <app-lucide-icon name="save" class="me-2" size="18"></app-lucide-icon>
      {{ isEditMode ? 'Update' : 'Save' }} Transaction
    </button>
  </form>
</div>
