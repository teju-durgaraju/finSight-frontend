<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header">
      <h3 class="mb-0">{{ isEditMode ? 'Edit' : 'Create' }} Budget</h3>
    </div>
    <div class="card-body">
      <form [formGroup]="budgetForm" (ngSubmit)="onSubmit()">
        <!-- Category Dropdown -->
        <div class="mb-3">
          <label for="category" class="form-label">Category:</label>
          <select id="category" class="form-select" formControlName="category"
                  [ngClass]="{ 'is-invalid': f['category'].touched && f['category'].invalid }">
            <option [ngValue]="null" disabled>Select a category</option> <!-- Changed value to null -->
            <option *ngFor="let cat of categories$ | async" [value]="cat.id">{{ cat.name }}</option>
          </select>
          <div *ngIf="f['category'].touched && f['category'].errors?.['required']" class="invalid-feedback">
            Category is required.
          </div>
        </div>

        <!-- Allocated Amount -->
        <div class="mb-3">
          <label for="amountAllocated" class="form-label">Allocated Amount:</label>
          <input type="number" id="amountAllocated" class="form-control" formControlName="amountAllocated" placeholder="0.00"
                 [ngClass]="{ 'is-invalid': f['amountAllocated'].touched && f['amountAllocated'].invalid }">
          <div *ngIf="f['amountAllocated'].touched && f['amountAllocated'].invalid" class="invalid-feedback">
            <span *ngIf="f['amountAllocated'].errors?.['required']">Allocated amount is required.</span>
            <span *ngIf="f['amountAllocated'].errors?.['min']">Amount must be greater than 0.01.</span>
            <span *ngIf="f['amountAllocated'].errors?.['pattern']">Amount must be a valid number (e.g., 12.34).</span>
          </div>
        </div>

        <!-- Month -->
        <div class="mb-3">
          <label for="month" class="form-label">Month:</label>
          <input type="month" id="month" class="form-control" formControlName="month"
                 [ngClass]="{ 'is-invalid': f['month'].touched && f['month'].invalid }">
          <div *ngIf="f['month'].touched && f['month'].errors?.['required']" class="invalid-feedback">
            Month is required (e.g., YYYY-MM).
          </div>
        </div>

        <!-- totalMonthlyBudgetGoal might be added here if it's user-editable -->
        <!-- For now, assuming it's handled differently or not on this form -->

        <div class="d-flex justify-content-end mt-4">
          <button type="button" class="btn btn-outline-secondary me-2" routerLink="/budgets">
            <app-lucide-icon name="x" class="me-1" size="18"></app-lucide-icon>Cancel
          </button>
          <button type="submit" class="btn btn-primary d-flex align-items-center" [disabled]="!budgetForm.valid">
            <app-lucide-icon name="save" class="me-1" size="18"></app-lucide-icon>
            {{ isEditMode ? 'Update' : 'Save' }} Budget
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
