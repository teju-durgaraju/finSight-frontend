<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card">
        <div class="card-body">
          <h3 class="card-title text-center mb-4">Register</h3>
          <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" id="username" class="form-control" formControlName="username" placeholder="Choose a username">
            </div>
            <div class="mb-3">
              <label for="emailReg" class="form-label">Email address</label>
              <input type="email" id="emailReg" class="form-control" formControlName="email" placeholder="Enter email">
            </div>
            <div class="mb-3">
              <label for="passwordReg" class="form-label">Password</label>
              <input type="password" id="passwordReg" class="form-control" formControlName="password" placeholder="Create password">
            </div>
            <button type="submit" class="btn btn-success w-100" [disabled]="!registrationForm.valid">Register</button>
          </form>
           <div class="text-center mt-3">
            <p>Already have an account? <a routerLink="/login">Login here</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
